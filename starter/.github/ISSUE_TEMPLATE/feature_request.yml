name: Feature request
description: Propose a new capability or a change to an existing one.
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today. Describe the problem before the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including workarounds you use now.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Who benefits, and how you know
      description: Users affected, frequency, or measurements that show the need.
    validations:
      required: false
